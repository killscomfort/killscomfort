<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>KillsComfort — Street Run</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#87ceeb;overflow:hidden;font-family:ui-monospace,monospace;touch-action:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #cv{flex:1;width:100%;min-height:0;display:block;image-rendering:pixelated;touch-action:none}
  .hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;z-index:5}
  .hud button{width:40px;height:40px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.22);border-radius:10px;font-size:16px}
  .touch{display:flex;gap:1rem;justify-content:center;align-items:center;padding:.75rem 1rem calc(.85rem + env(safe-area-inset-bottom))}
  .touch button{width:72px;height:72px;border-radius:16px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.22);font-size:28px}
  .touch.hidden{display:none}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:10;padding:20px}
  .overlay.hidden{display:none}
  .box{max-width:340px;background:#0c0c0e;border:1px solid #3a3a42;color:#e9e9ec;padding:20px;text-align:center}
  .box h2{margin:0 0 8px;font-family:Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.08em}
  .box p{margin:0 0 14px;font-size:13px;line-height:1.5;color:#9a9aa3}
  .box button,.row button{appearance:none;border:1.5px solid #c7cace;background:linear-gradient(180deg,#f4f5f7,#c7cace);color:#0a0a0b;font-family:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:12px 18px;cursor:pointer;margin:4px}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .pick{display:flex;gap:10px;justify-content:center;margin:12px 0}
  .pick button{background:transparent;color:#e9e9ec;border:1px solid #3a3a42}
  .pick button.on{border-color:#f4f5f7;background:rgba(255,255,255,.08)}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <button type="button" id="pauseBtn" aria-label="Pause">❚❚</button>
    <button type="button" id="backBtn" aria-label="Back to warehouse">←</button>
  </div>
  <canvas id="cv"></canvas>
  <div class="touch hidden" id="touchBar">
    <button type="button" id="leftBtn" aria-label="Left">◀</button>
    <span style="font-size:10px;opacity:.7">swipe · 5 lanes</span>
    <button type="button" id="rightBtn" aria-label="Right">▶</button>
  </div>
  <div class="overlay" id="startOverlay">
    <div class="box">
      <h2>Street Run</h2>
      <p>Dodge obstacles in your lane. Arrow keys, A/D, or swipe on mobile. Kid-friendly speed ramp.</p>
      <div class="pick">
        <button type="button" class="on" data-char="boy">Boy</button>
        <button type="button" data-char="girl">Girl</button>
      </div>
      <button type="button" id="startBtn">Ride →</button>
    </div>
  </div>
  <div class="overlay hidden" id="overOverlay">
    <div class="box">
      <h2>Wiped out</h2>
      <p>Score <b id="finalScore">0</b> · Best <b id="bestScore">0</b></p>
      <div class="row">
        <button type="button" id="againBtn">Run again</button>
        <button type="button" id="hubBtn">Back to warehouse</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var W=400,H=360,HORIZON=46,LANE_MIN=-2,LANE_MAX=2,TOP_HW=14,BOT_HW=252;
  var BASE_SPEED=0.0025,MAX_SPEED=0.012,SPEED_BUMP=0.002,SPEED_RAMP_MS=30000;
  var PAL={skinB:"#caa078",skinG:"#d8ad82",hairB:"#241c16",hairG:"#3a2418",shirtB:"#3a4a52",shirtG:"#8a4a5a"};
  var character="boy",paused=false,running=false,reported=false,raf=0;
  var sg={laneX:0,targetLane:0,speed:BASE_SPEED,speedTier:0,startMs:0,dist:0,obstacles:[],spawnTimer:58,score:0,frame:0};
  var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  var isTouch="ontouchstart" in window||navigator.maxTouchPoints>0;
  if(isTouch) document.getElementById("touchBar").classList.remove("hidden");

  function blip(t,f){ try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; var c=new AC(),o=c.createOscillator(),g=c.createGain(); o.type="square"; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.14,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+.12); o.connect(g).connect(c.destination); o.start(t); o.stop(t+.14);}catch(e){} }

  function resize(){ var r=cv.parentElement.getBoundingClientRect(); var dpr=Math.min(2,devicePixelRatio||1); cv.width=Math.max(1,Math.floor(r.width*dpr)); cv.height=Math.max(1,Math.floor(r.height*dpr)); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.imageSmoothingEnabled=false; }
  new ResizeObserver(resize).observe(cv.parentElement); resize();

  function roadHalf(t){ return TOP_HW+(BOT_HW-TOP_HW)*Math.pow(t,1.38); }
  function yAt(t){ return HORIZON+(H-HORIZON)*Math.pow(t,.98); }
  function laneSpace(t){ return roadHalf(t)*.19; }
  function laneX(t,lane){ return W/2+lane*laneSpace(t); }

  function spawn(){ var lane=LANE_MIN+Math.floor(Math.random()*(LANE_MAX-LANE_MIN+1)); var kinds=["cone","barrier","hydrant","trash","pothole"]; sg.obstacles.push({lane:lane,t:.004,kind:kinds[Math.floor(Math.random()*kinds.length)],passed:false}); }
  function setLane(n){ sg.targetLane=Math.max(LANE_MIN,Math.min(LANE_MAX,n)); }
  function laneLeft(){ if(!running||paused)return; setLane(sg.targetLane-1); blip(0,320); }
  function laneRight(){ if(!running||paused)return; setLane(sg.targetLane+1); blip(0,380); }

  function drawSky(){ var g=ctx.createLinearGradient(0,0,0,HORIZON); g.addColorStop(0,"#5eb3e8"); g.addColorStop(1,"#b8e4f8"); ctx.fillStyle=g; ctx.fillRect(0,0,W,HORIZON); ctx.fillStyle="#ffe566"; ctx.beginPath(); ctx.arc(W*.78,HORIZON*.38,22,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#8aab8e"; ctx.fillRect(0,HORIZON-4,W,8); }
  function drawRoad(){ ctx.fillStyle="#5a9462"; ctx.fillRect(0,HORIZON,W,H-HORIZON); ctx.beginPath(); ctx.moveTo(W/2-TOP_HW,HORIZON); ctx.lineTo(W/2+TOP_HW,HORIZON); ctx.lineTo(W/2+BOT_HW,H); ctx.lineTo(W/2-BOT_HW,H); ctx.closePath(); ctx.fillStyle="#4a4a52"; ctx.fill(); ctx.strokeStyle="#f0e040"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(W/2-TOP_HW,HORIZON); ctx.lineTo(W/2-BOT_HW,H); ctx.stroke(); ctx.beginPath(); ctx.moveTo(W/2+TOP_HW,HORIZON); ctx.lineTo(W/2+BOT_HW,H); ctx.stroke(); }
  function drawOb(o){ var t=o.t,y=yAt(t),x=laneX(t,o.lane),s=18*(.2+Math.pow(t,1.35)*1.05); if(o.kind==="cone"){ ctx.fillStyle="#ff6a1a"; ctx.beginPath(); ctx.moveTo(x,y-s*1.35); ctx.lineTo(x-s*.55,y); ctx.lineTo(x+s*.55,y); ctx.closePath(); ctx.fill(); } else if(o.kind==="barrier"){ var bw=s*1.1,bh=s*.95; for(var i=0;i<4;i++){ ctx.fillStyle=i%2? "#fff":"#e83838"; ctx.fillRect(x-bw/2+i*bw/4,y-bh,bw/4,bh);} } else if(o.kind==="hydrant"){ ctx.fillStyle="#e02020"; ctx.fillRect(x-s*.28,y-s*1.1,s*.56,s*1.05); } else if(o.kind==="trash"){ ctx.fillStyle="#2a3540"; ctx.fillRect(x-s*.45,y-s*1.05,s*.9,s*1.02); } else { ctx.fillStyle="rgba(0,0,0,.55)"; ctx.beginPath(); ctx.ellipse(x,y,s*.85,s*.38,0,0,Math.PI*2); ctx.fill(); } }
  function drawBike(){ var t=.96,x=laneX(t,sg.laneX),y=H-8,skin=character==="girl"?PAL.skinG:PAL.skinB,shirt=character==="girl"?PAL.shirtG:PAL.shirtB,hair=character==="girl"?PAL.hairG:PAL.hairB,pedal=sg.frame%2?1:-1; ctx.save(); ctx.translate(x,y); ctx.fillStyle="rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(0,6,30,8,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#1a1a1a"; ctx.beginPath(); ctx.ellipse(-10,0,14,6,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(10,0,14,6,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle="#888"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(0,-28); ctx.lineTo(10,0); ctx.stroke(); ctx.fillStyle=shirt; ctx.fillRect(-13,-58,26,22); ctx.fillStyle=skin; ctx.fillRect(-9,-72,18,16); ctx.fillStyle=hair; ctx.fillRect(-10,-74,20,8); ctx.strokeStyle="#aaa"; ctx.beginPath(); ctx.moveTo(-8,-2); ctx.lineTo(-8+pedal*4,4); ctx.stroke(); ctx.restore(); }

  function resetGame(){ sg={laneX:0,targetLane:0,speed:BASE_SPEED,speedTier:0,startMs:performance.now(),dist:0,obstacles:[],spawnTimer:58,score:0,frame:0}; running=true; reported=false; paused=false; }
  function crash(){ if(reported)return; reported=true; running=false; var score=Math.floor(sg.score); setTimeout(function(){ showGameOver(score); },350); }

  function step(){
    sg.frame++;
    if(running&&!paused){
      sg.laneX+=(sg.targetLane-sg.laneX)*.2; sg.dist+=sg.speed; sg.score+=sg.speed*48;
      var tier=Math.floor((performance.now()-sg.startMs)/SPEED_RAMP_MS);
      if(tier!==sg.speedTier){ sg.speedTier=tier; sg.speed=Math.min(MAX_SPEED,BASE_SPEED+tier*SPEED_BUMP); }
      sg.spawnTimer--; if(sg.spawnTimer<=0){ spawn(); sg.spawnTimer=Math.max(30,58-Math.min(14,Math.floor(sg.score/220))); }
      sg.obstacles.forEach(function(o){ o.t+=sg.speed*1.22; });
      sg.obstacles=sg.obstacles.filter(function(o){ return o.t<1.08; });
      sg.obstacles.forEach(function(o){ if(!o.passed&&o.t>.93){ o.passed=true; if(Math.abs(o.lane-sg.laneX)<.5) crash(); }});
    }
    var dpr=Math.min(2,devicePixelRatio||1);
    var pw=cv.clientWidth, ph=cv.clientHeight, scale=Math.min(pw/W, ph/H);
    var ox=(pw-W*scale)/2, oy=(ph-H*scale)/2;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,pw,ph);
    ctx.save();
    ctx.setTransform(scale*dpr,0,0,scale*dpr,ox*dpr,oy*dpr);
    drawSky(); drawRoad(); sg.obstacles.slice().sort(function(a,b){return a.t-b.t;}).forEach(drawOb); drawBike();
    ctx.fillStyle="#1a2a1a"; ctx.font="bold 12px monospace"; ctx.fillText(String(Math.floor(sg.score)),10,22);
    if(paused&&running){ ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#fff"; ctx.font="bold 14px monospace"; ctx.textAlign="center"; ctx.fillText("PAUSED",W/2,H/2); ctx.textAlign="left"; }
    ctx.restore();
    if(running||!reported) raf=requestAnimationFrame(step);
  }

  function usernameFromEmail(email){ var base=email.split("@")[0].replace(/[^a-zA-Z0-9 _-]/g,"").slice(0,20); return base.length>=2?base:"rider"; }
  function saveScore(score){
    var email=""; try{ email=localStorage.getItem("kc_email")||""; }catch(e){}
    if(!email||score<1) return;
    fetch("/api/street-run/scores",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:usernameFromEmail(email),email:email,score:score,character:character})}).catch(function(){});
  }
  function best(){ try{ return parseInt(localStorage.getItem("kc-street-best")||"0",10)||0; }catch(e){ return 0; } }
  function setBest(n){ try{ localStorage.setItem("kc-street-best",String(n)); }catch(e){} }

  function showGameOver(score){
    document.getElementById("finalScore").textContent=String(score);
    var b=Math.max(best(),score); setBest(b);
    document.getElementById("bestScore").textContent=String(b);
    document.getElementById("overOverlay").classList.remove("hidden");
    saveScore(score);
    if(window.parent&&window.parent!==window) window.parent.postMessage({type:"kc-street-run",action:"gameover",score:score},"*");
  }
  function closeToHub(){ if(window.parent&&window.parent!==window) window.parent.postMessage({type:"kc-street-run",action:"close"},"*"); }

  document.querySelectorAll(".pick button").forEach(function(btn){
    btn.onclick=function(){ document.querySelectorAll(".pick button").forEach(function(b){ b.classList.remove("on"); }); btn.classList.add("on"); character=btn.getAttribute("data-char")||"boy"; };
  });
  document.getElementById("startBtn").onclick=function(){ document.getElementById("startOverlay").classList.add("hidden"); resetGame(); cancelAnimationFrame(raf); step(); };
  document.getElementById("pauseBtn").onclick=function(){ if(!running)return; paused=!paused; document.getElementById("pauseBtn").textContent=paused?"▶":"❚❚"; };
  document.getElementById("backBtn").onclick=closeToHub;
  document.getElementById("againBtn").onclick=function(){ document.getElementById("overOverlay").classList.add("hidden"); resetGame(); cancelAnimationFrame(raf); step(); };
  document.getElementById("hubBtn").onclick=closeToHub;
  document.getElementById("leftBtn").onclick=function(e){ e.preventDefault(); laneLeft(); };
  document.getElementById("rightBtn").onclick=function(e){ e.preventDefault(); laneRight(); };
  window.addEventListener("keydown",function(e){
    if(e.key==="p"||e.key==="P"||e.key==="Escape"){ if(running){ paused=!paused; document.getElementById("pauseBtn").textContent=paused?"▶":"❚❚"; } return; }
    if(!running||paused)return;
    if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A") laneLeft();
    if(e.key==="ArrowRight"||e.key==="d"||e.key==="D") laneRight();
  });
  var tx=null;
  cv.addEventListener("touchstart",function(e){ if(e.target.closest("button"))return; tx=e.touches[0].clientX; },{passive:true});
  cv.addEventListener("touchend",function(e){ if(tx===null)return; var dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>20)(dx<0?laneLeft:laneRight)(); tx=null; },{passive:true});
})();
</script>
</body>
</html>
